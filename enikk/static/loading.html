<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enikk</title>
<style>
  html,body{height:100%;margin:0}
  body{background:#f8f9fa;color:#1f2937;font-family:'Segoe UI',system-ui,sans-serif;
       display:flex;flex-direction:column;align-items:center;justify-content:center}
  .wm{font-size:30px;font-weight:700;letter-spacing:.5px}
  .ver{font-size:13px;color:#6b7280;margin-top:6px}
  .spin{margin-top:30px;width:34px;height:34px;border:3px solid #e3e5e8;
        border-top-color:#10a37f;border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #status{margin-top:22px;font-size:13px;color:#6b7280;min-height:1em}
</style>
</head>
<body>
  <div class="wm">Enikk</div>
  <div class="ver">v__VERSION__</div>
  <div class="spin"></div>
  <p id="status">Loading…</p>
  <script>
    window.enikkSetStatus = function(t){
      var el = document.getElementById('status');
      if (el) el.textContent = t;
    };
  </script>
</body>
</html>
